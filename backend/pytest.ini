[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: Fast deterministic unit and workflow tests using mocked LLM events and in-memory Firestore
    integration: Live tests hitting real Gemini / Firestore APIs
    e2e: End-to-end HTTP API tests against FastAPI endpoints
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
